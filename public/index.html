<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KinoNews - Cinema Community</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <a href="/" onclick="loadPage('home'); return false;">
          <span class="logo-icon">🎬</span>
          <span class="logo-text">KinoNews</span>
        </a>
      </div>
      <nav class="nav">
        <a href="/new" onclick="loadPage('new'); return false;">new</a>
        <a href="/submit" onclick="loadPage('submit'); return false;">submit</a>
        <span id="userNav"></span>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <!-- Content will be loaded here dynamically -->
  </main>

  <!-- Modals -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeAuthModal()">&times;</span>
      <h2 id="authModalTitle">Sign In</h2>
      <form id="authForm">
        <div class="form-group">
          <label for="authUsername">Username:</label>
          <input type="text" id="authUsername" required autocomplete="username">
        </div>
        <div class="form-group" id="emailGroup" style="display: none;">
          <label for="authEmail">Email (optional):</label>
          <input type="email" id="authEmail" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="authPassword">Password:</label>
          <input type="password" id="authPassword" required autocomplete="current-password">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Submit</button>
          <a href="#" id="toggleAuth" onclick="toggleAuthMode(); return false;">
            Create account
          </a>
        </div>
        <div id="authError" class="error"></div>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
